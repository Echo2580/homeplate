<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>设备信息 · homeplate</title>
  <script src="/static/js/tailwindcss.js"></script>
  <script src="/static/js/iconify-icon.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</head>
<body class="w-full min-h-dvh m-0 flex justify-center bg-[#EDEFF3]">
<div class="relative w-full max-w-[480px] min-h-dvh bg-[#F5F6F8] flex flex-col shadow-[0_10px_40px_rgba(16,24,40,0.12)]">
  <!-- 顶部导航 -->
  <header class="shrink-0 relative px-4 pt-4 pb-2 flex items-center h-[56px]">
    <a id="back-link" aria-label="返回" class="w-9 h-9 flex items-center justify-center text-[#12151C] -ml-1 active:opacity-60" href="/add">
      <iconify-icon class="text-[28px]" icon="mdi:chevron-left"></iconify-icon>
    </a>
    <h1 id="page-title" class="absolute inset-x-0 text-center text-[17px] font-bold text-[#12151C] pointer-events-none">确认设备信息</h1>
  </header>
  <main class="flex-1 min-h-0 overflow-y-auto px-5 pt-2 pb-8">
    <p id="sub-title" class="text-[12px] text-[#8A93A5] mb-3" data-ai="以下信息由 AI 识别预填，请核对修改后保存" data-manual="手动填写设备信息，带 * 为必填">以下信息由 AI 识别预填，请核对修改后保存</p>
    <!-- 表单 -->
    <section class="bg-white rounded-[12px] border border-[#EEF0F4] shadow-[0_1px_2px_rgba(16,24,40,0.04)] overflow-hidden">
      <div class="flex items-center justify-between px-4 py-3 border-b border-[#F1F3F7] gap-3">
        <label class="shrink-0 text-[13px] text-[#8A93A5]" for="f-name">设备名称 <span class="text-[#FF7A45]">*</span></label>
        <input id="f-name" class="flex-1 text-right text-[16px] text-[#12151C] outline-none" placeholder="如：客厅空调">
      </div>
      <div class="flex items-center justify-between px-4 py-3 border-b border-[#F1F3F7] gap-3">
        <label class="shrink-0 text-[13px] text-[#8A93A5]" for="f-brand">品牌</label>
        <input id="f-brand" class="flex-1 text-right text-[16px] text-[#12151C] outline-none" placeholder="格力">
      </div>
      <div class="flex items-center justify-between px-4 py-3 border-b border-[#F1F3F7] gap-3">
        <label class="shrink-0 text-[13px] text-[#8A93A5]" for="f-model">型号</label>
        <input id="f-model" class="flex-1 text-right text-[16px] text-[#12151C] outline-none" placeholder="KFR-35GW">
      </div>
      <div class="flex items-center justify-between px-4 py-3 border-b border-[#F1F3F7] gap-3">
        <label class="shrink-0 text-[13px] text-[#8A93A5]" for="f-serial">序列号</label>
        <input id="f-serial" class="flex-1 text-right text-[16px] text-[#12151C] outline-none" placeholder="铭牌上的 SN">
      </div>
      <div class="flex items-center justify-between px-4 py-3 border-b border-[#F1F3F7] gap-3">
        <label class="shrink-0 text-[13px] text-[#8A93A5]" for="f-category">品类</label>
        <div class="flex-1 flex items-center justify-end gap-2">
          <input id="f-category-custom" class="hidden w-28 text-right text-[16px] text-[#12151C] outline-none border-b border-[#3D6DF2]" placeholder="输入品类" maxlength="20">
          <select id="f-category" class="text-right text-[16px] text-[#12151C] outline-none bg-transparent max-w-[60%]">
            <option value="">请选择品类</option>
            <option>空调</option><option>冰箱</option><option>洗衣机</option>
            <option>净水器</option><option>电热水器</option><option>油烟机</option>
            <option>电视</option><option>扫地机器人</option>
            <option>电磁炉</option><option>微波炉</option><option>电饭煲</option><option>电风扇</option>
            <option>电压力锅</option><option>热水壶</option><option>加湿器</option><option>空气净化器</option>
            <option>取暖器</option><option>挂烫机</option><option>豆浆机</option><option>破壁机</option>
            <option>其他</option>
            <option value="__custom__">自定义…</option>
          </select>
        </div>
      </div>
      <div class="flex items-center justify-between px-4 py-3 border-b border-[#F1F3F7] gap-3">
        <label class="shrink-0 text-[13px] text-[#8A93A5]" for="f-date">购买日期 <span class="text-[#FF7A45]">*</span></label>
        <input id="f-date" type="date" class="flex-1 text-right text-[16px] text-[#12151C] outline-none">
      </div>
      <div class="flex items-center justify-between px-4 py-3 gap-3">
        <label class="shrink-0 text-[13px] text-[#8A93A5]" for="f-months">保修期（月）</label>
        <input id="f-months" type="number" min="1" class="flex-1 text-right text-[16px] text-[#12151C] outline-none" placeholder="如 72">
      </div>
    </section>
    <!-- 保修到期预览 -->
    <p id="preview" class="mt-3 mx-1 px-3 py-2.5 rounded-[10px] bg-[#EEF3FE] text-[12px] text-[#2E5BDA] leading-[1.6]">
      选择品类和购买日期后，这里会自动算出保修到期日
    </p>
    <!-- 保存 -->
    <button type="button" id="btn-save"
      class="mt-5 w-full h-12 rounded-[12px] bg-[#3D6DF2] text-white text-[15px] font-medium active:scale-[0.98] transition-transform shadow-[0_6px_18px_rgba(61,109,242,0.35)]">
      保存
    </button>
  </main>
</div>
<script>
  const $ = id => document.getElementById(id);
  // 品类 → 默认保修月数（与 docs/mvp.md 附表一致）
  const DEFAULT_MONTHS = {
    "空调": 72, "冰箱": 36, "洗衣机": 36, "净水器": 12,
    "电热水器": 36, "油烟机": 36, "电视": 12, "扫地机器人": 12,
  };

  function setCategory(cat) {
    if (!cat) return;
    const sel = $('f-category');
    const opt = [...sel.options].find(o => o.text === cat || o.value === cat);
    if (opt) {
      sel.value = opt.value === '__custom__' ? '__custom__' : cat;
      if (opt.value !== '__custom__') $('f-category-custom').classList.add('hidden');
    } else {
      // AI 识别出列表外的品类：转入自定义输入并提示
      sel.value = '__custom__';
      const cus = $('f-category-custom');
      cus.classList.remove('hidden');
      cus.value = cat;
    }
  }

  // 自定义品类：选中"自定义…"时显示输入框
  $('f-category').addEventListener('change', () => {
    const cus = $('f-category-custom');
    if ($('f-category').value === '__custom__') {
      cus.classList.remove('hidden');
      cus.focus();
    } else {
      cus.classList.add('hidden');
    }
    const m = DEFAULT_MONTHS[$('f-category').value];
    if (m && !$('f-months').value) $('f-months').value = m;
    updatePreview();
  });

  function fillForm(d) {
    if (d.name) $('f-name').value = d.name;
    if (d.brand) $('f-brand').value = d.brand;
    if (d.model_name) $('f-model').value = d.model_name;
    if (d.serial_number) $('f-serial').value = d.serial_number;
    if (d.category) setCategory(d.category);
    if (d.purchase_date) $('f-date').value = d.purchase_date;
    // 保修月数：优先用已有值，否则按品类默认——程序赋值不触发 change，这里手动兜底
    $('f-months').value = d.warranty_months || DEFAULT_MONTHS[d.category] || '';
    updatePreview();
  }

  // ---------- 双模式：编辑（?id=xx） / 新建 ----------
  const editId = new URLSearchParams(location.search).get('id');
  const isEdit = !!editId;

  // 防脏数据粘连：直接进本页（没有从拍摄页带识别结果）时，清掉上一次会话残留的
  // 识别结果和照片 token——否则给 A 设备拍的照片可能粘到 B 设备上
  if (!isEdit && !sessionStorage.getItem('recognize_result')) {
    sessionStorage.removeItem('photo_token');
  }

  if (isEdit) {
    // 编辑模式：拉现有数据预填，保存走 PATCH
    $('page-title').textContent = '编辑设备信息';
    $('sub-title').textContent = '修改后点击保存，改动会立即生效';
    $('back-link').href = '/devices/' + editId;
    $('btn-save').textContent = '保存修改';
    fetch('/api/devices/' + editId)
      .then(r => r.json())
      .then(fillForm)
      .catch(() => alert('设备信息加载失败，请刷新重试'));
  } else {
    // 新建模式：预填拍摄页的识别结果；没有则说明是手动填写入口
    const saved = sessionStorage.getItem('recognize_result');
    if (saved) {
      try {
        fillForm(JSON.parse(saved));
      } catch (e) { /* 预填失败不阻塞手动填写 */ }
    } else {
      const st = document.getElementById('sub-title');
      st.textContent = st.dataset.manual;
    }
  }

  // 显示 AI 识别耗时（拍摄页带过来的）
  const elapsed = new URLSearchParams(location.search).get('elapsed');
  if (elapsed) {
    const st = document.getElementById('sub-title');
    st.textContent = `AI 识别耗时 ${elapsed} 秒 · ` + st.textContent;
  }

  // 选品类 → 自动填默认保修月数
  $('f-category').addEventListener('change', () => {
    const m = DEFAULT_MONTHS[$('f-category').value];
    if (m && !$('f-months').value) $('f-months').value = m;
    updatePreview();
  });
  $('f-date').addEventListener('change', updatePreview);
  $('f-months').addEventListener('input', updatePreview);

  // 保修到期日 = 购买日期 + 保修月数（前端只做预览，真实计算在后端）
  function updatePreview() {
    const date = $('f-date').value;
    const months = parseInt($('f-months').value, 10);
    if (!date || !months || months <= 0) return;
    const d = new Date(date);
    d.setMonth(d.getMonth() + months);
    const end = d.toISOString().slice(0, 10);
    $('preview').textContent = `按 ${months} 个月保修计算，保修到期 ${end}（保存后可在详情页查看）`;
  }

  // 保存：新建 POST / 编辑 PATCH
  $('btn-save').addEventListener('click', async () => {
    const name = $('f-name').value.trim();
    const purchase_date = $('f-date').value;
    if (!name) { alert('请给设备起个名字，如：客厅空调'); return; }
    if (!purchase_date) { alert('购买日期是必填的——保修期就靠它算'); return; }
    const payload = {
      name,
      brand: $('f-brand').value.trim() || null,
      model_name: $('f-model').value.trim() || null,
      serial_number: $('f-serial').value.trim() || null,
      category: ($('f-category').value === '__custom__' ? ($('f-category-custom').value.trim() || null) : ($('f-category').value || null)),
      purchase_date,
      warranty_months: parseInt($('f-months').value, 10) || null,
    };
    // 铭牌照片：拍摄页上传拿到的 token，新建时一并提交（编辑不换照片）
    const photoToken = sessionStorage.getItem('photo_token');
    if (!isEdit && photoToken) payload.photo_token = photoToken;
    const btn = $('btn-save');
    btn.disabled = true; btn.textContent = '保存中…';
    try {
      const r = await fetch(isEdit ? '/api/devices/' + editId : '/api/devices', {
        method: isEdit ? 'PATCH' : 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const d = await r.json();
      if (!r.ok) {
        // 422 的 detail 可能是数组（FastAPI 校验错误），兜底成可读文案
        let msg = d.detail || '保存失败';
        if (Array.isArray(msg)) {
          msg = msg.map(x => (x.msg || '').replace(/String should have at most \d+ characters/, '内容太长了').replace(/Value error, /, '')).join('；');
        } else if (typeof msg === 'object') {
          msg = JSON.stringify(msg);
        }
        throw new Error(msg);
      }
      if (!isEdit) {
        sessionStorage.removeItem('recognize_result');
        sessionStorage.removeItem('photo_token');
      }
      if (isEdit === false && d.photo_saved === false) {
        alert('设备已保存，但铭牌照片没能存上（可能已过期），可稍后在详情页重拍补传');
      }
      location.href = '/devices/' + (isEdit ? editId : d.id);
    } catch (e) {
      alert(e.message);
      btn.disabled = false; btn.textContent = isEdit ? '保存修改' : '保存';
    }
  });
</script>
</body>
</html>
