<script>
    (function () {
      const track = document.getElementById('track');
      const main = document.getElementById('onboarding');
      const slides = Array.from(document.querySelectorAll('.ob-slide'));
      const dots = Array.from(document.querySelectorAll('[data-dot]'));
      const skipBtn = document.getElementById('skipBtn');
      const startBtn = document.getElementById('startBtn');
      const total = slides.length;
      let index = 0;
      let startX = null;
      let startY = null;

      function render() {
        track.style.transform = 'translateX(-' + index * 100 + '%)';

        slides.forEach((slide, i) => {
          slide.setAttribute('aria-hidden', i === index ? 'false' : 'true');
        });

        dots.forEach((dot, i) => {
          const active = i === index;
          dot.style.width = '6px';
          dot.style.height = '6px';
          dot.style.backgroundColor = active ? '#3D6DF2' : '#D6DBE4';
          dot.style.boxShadow = active ? '0 0 0 3px rgba(61, 109, 242, .16)' : 'none';
          if (active) {
            dot.setAttribute('aria-current', 'true');
          } else {
            dot.removeAttribute('aria-current');
          }
        });

        skipBtn.classList.toggle('hidden', index !== 0);

        const onLast = index === total - 1;
        startBtn.classList.toggle('hidden', !onLast);
        startBtn.classList.toggle('flex', onLast);
      }

      function goTo(next) {
        index = Math.max(0, Math.min(total - 1, next));
        render();
      }

      dots.forEach((dot, i) => {
        dot.addEventListener('click', () => goTo(i));
      });

      main.addEventListener('pointerdown', (event) => {
        if (event.pointerType === 'mouse' && event.button !== 0) return;
        startX = event.clientX;
        startY = event.clientY;
      });

      main.addEventListener('pointerup', (event) => {
        if (startX === null) return;
        const dx = event.clientX - startX;
        const dy = event.clientY - startY;
        startX = null;
        startY = null;
        if (Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy) * 1.2) {
          goTo(index + (dx < 0 ? 1 : -1));
        }
      });

      main.addEventListener('pointercancel', () => {
        startX = null;
        startY = null;
      });

      window.addEventListener('keydown', (event) => {
        if (event.key === 'ArrowRight') goTo(index + 1);
        if (event.key === 'ArrowLeft') goTo(index - 1);
      });

      render();
    })();
  </script>
