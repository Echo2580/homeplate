<!DOCTYPE html>

<html class="w-full h-full overflow-hidden" lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>homeplate · 家电档案管家</title>
<script src="https://modao.cc/agent-py/static/source/js/tailwindcss.js"></script>
<script src="https://modao.cc/agent-py/static/source/js/iconify-icon.min.js"></script>
<style>
    html, body { height: 100%; }
    body {
      font-family: 'PingFang SC', 'Source Han Sans SC', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    input, textarea, button { font-family: inherit; }
  </style>
</head>
<body class="w-full h-full m-0 overflow-hidden flex items-center justify-center bg-[#E7EAF0]">
<div class="w-full h-full max-w-[375px] max-h-[812px] bg-[#F5F6F8] flex flex-col overflow-hidden relative">
<!-- 状态栏 -->
<div class="shrink-0 h-11 px-5 pt-2 flex items-center justify-between text-[12px] font-semibold text-[#111827]">
<span>9:41</span>
<div class="flex items-center gap-1.5">
<iconify-icon class="text-[14px]" icon="mdi:signal"></iconify-icon>
<iconify-icon class="text-[14px]" icon="mdi:wifi"></iconify-icon>
<iconify-icon class="text-[15px]" icon="mdi:battery"></iconify-icon>
</div>
</div>
<!-- 主滚动区 -->
<main class="flex-1 min-h-0 overflow-y-auto overflow-x-hidden [scrollbar-width:none] [&amp;::-webkit-scrollbar]:hidden">
<!-- 页面标题 -->
<div class="px-5 pt-1 flex items-center justify-between">
<h1 class="text-[22px] font-bold leading-8 text-[#111827] tracking-tight">我的家电</h1>
<a aria-label="添加家电" class="w-9 h-9 rounded-full bg-[#3D6DF2] text-white flex items-center justify-center shadow-[0_4px_12px_rgba(61,109,242,0.32)] active:scale-95 transition" href="add_appliance.html">
<iconify-icon class="text-[22px]" icon="mdi:plus"></iconify-icon>
</a>
</div>
<!-- 统计卡片 -->
<section class="px-5 mt-4 grid grid-cols-3 gap-2.5">
<div class="rounded-xl bg-white border border-[#EEF0F4] shadow-[0_2px_10px_rgba(17,24,39,0.04)] px-3 py-3">
<p class="text-[11px] text-[#8A93A5] leading-4">家电总数</p>
<p class="mt-1.5 text-[22px] font-bold leading-7 text-[#3D6DF2]">4<span class="ml-0.5 text-[11px] font-normal text-[#8A93A5]">台</span></p>
</div>
<div class="rounded-xl bg-white border border-[#EEF0F4] shadow-[0_2px_10px_rgba(17,24,39,0.04)] px-3 py-3">
<p class="text-[11px] text-[#8A93A5] leading-4">待保养 30 天内</p>
<p class="mt-1.5 text-[22px] font-bold leading-7 text-[#FF7A45]">3<span class="ml-0.5 text-[11px] font-normal text-[#8A93A5]">项</span></p>
<p class="mt-0.5 text-[10px] leading-4 text-[#FF7A45]">含逾期 2 项</p>
</div>
<div class="rounded-xl bg-white border border-[#EEF0F4] shadow-[0_2px_10px_rgba(17,24,39,0.04)] px-3 py-3">
<p class="text-[11px] text-[#8A93A5] leading-4">即将过保</p>
<p class="mt-1.5 flex items-center gap-1 text-[22px] font-bold leading-7 text-[#FF7A45]">
<iconify-icon class="text-[16px]" icon="mdi:alert-outline"></iconify-icon>1<span class="text-[11px] font-normal text-[#8A93A5]">台</span>
</p>
</div>
</section>
<!-- 设备列表（按家庭优先级排序） -->
<section class="px-5 mt-5">
<h2 class="text-[15px] font-semibold text-[#111827]">设备列表</h2>
<div class="mt-3 space-y-3">
<!-- 1. 逾期保养 -->
<a class="block rounded-xl bg-white border border-[#EEF0F4] border-l-[3px] border-l-[#FF7A45] p-3.5 shadow-[0_2px_10px_rgba(255,122,69,0.10)] active:scale-[0.99] transition" href="device_detail.html">
<div class="flex items-start gap-3">
<span class="w-11 h-11 rounded-full bg-[#FFF1EA] text-[#FF7A45] flex items-center justify-center shrink-0">
<iconify-icon class="text-[23px]" icon="mdi:fridge-outline"></iconify-icon>
</span>
<div class="flex-1 min-w-0">
<div class="flex items-start justify-between gap-2">
<div class="min-w-0">
<p class="text-[14px] font-semibold text-[#111827] truncate">客厅冰箱</p>
<p class="mt-0.5 text-[12px] text-[#8A93A5] truncate">海尔 BCD-621</p>
</div>
<span class="shrink-0 text-[10px] leading-4 px-2 py-1 rounded-full bg-[#FFF1EA] text-[#E2632B] font-medium">清洁除霜 已逾期 5 天</span>
</div>
<div class="mt-2.5 pt-2.5 border-t border-[#F3F4F7] flex items-center justify-between">
<span class="flex items-center gap-1 text-[12px] text-[#8A93A5]">
<iconify-icon class="text-[14px] text-[#1FAF6B]" icon="mdi:shield-check-outline"></iconify-icon>
                    保修剩 8 个月
                  </span>
<iconify-icon class="text-[16px] text-[#C3C9D4]" icon="mdi:chevron-right"></iconify-icon>
</div>
</div>
</div>
</a>
<!-- 2. 即将过保 -->
<a class="block rounded-xl bg-white border border-[#EEF0F4] p-3.5 shadow-[0_2px_10px_rgba(17,24,39,0.04)] active:scale-[0.99] transition" href="device_detail.html">
<div class="flex items-start gap-3">
<span class="w-11 h-11 rounded-full bg-[#EAF0FF] text-[#3D6DF2] flex items-center justify-center shrink-0">
<iconify-icon class="text-[23px]" icon="mdi:air-conditioner"></iconify-icon>
</span>
<div class="flex-1 min-w-0">
<div class="flex items-start justify-between gap-2">
<div class="min-w-0">
<p class="text-[14px] font-semibold text-[#111827] truncate">主卧空调</p>
<p class="mt-0.5 text-[12px] text-[#8A93A5] truncate">格力 KFR-35GW</p>
</div>
<span class="shrink-0 text-[10px] leading-4 px-2 py-1 rounded-full bg-[#FFF7E6] text-[#C98A00] font-medium">保修剩 23 天</span>
</div>
<div class="mt-2.5 pt-2.5 border-t border-[#F3F4F7] flex items-center justify-between">
<span class="flex items-center gap-1 text-[12px] text-[#8A93A5]">
<iconify-icon class="text-[14px] text-[#3D6DF2]" icon="mdi:air-filter"></iconify-icon>
                    下次保养：清洗滤网 · 12 天后
                  </span>
<iconify-icon class="text-[16px] text-[#C3C9D4]" icon="mdi:chevron-right"></iconify-icon>
</div>
</div>
</div>
</a>
<!-- 3. 正常 -->
<a class="block rounded-xl bg-white border border-[#EEF0F4] p-3.5 shadow-[0_2px_10px_rgba(17,24,39,0.04)] active:scale-[0.99] transition" href="device_detail.html">
<div class="flex items-start gap-3">
<span class="w-11 h-11 rounded-full bg-[#E9F8F1] text-[#1FAF6B] flex items-center justify-center shrink-0">
<iconify-icon class="text-[23px]" icon="mdi:washing-machine"></iconify-icon>
</span>
<div class="flex-1 min-w-0">
<div class="flex items-start justify-between gap-2">
<div class="min-w-0">
<p class="text-[14px] font-semibold text-[#111827] truncate">阳台洗衣机</p>
<p class="mt-0.5 text-[12px] text-[#8A93A5] truncate">小天鹅 TG100V88</p>
</div>
<span class="shrink-0 text-[10px] leading-4 px-2 py-1 rounded-full bg-[#E9F8F1] text-[#158A54] font-medium">保修剩 14 个月</span>
</div>
<div class="mt-2.5 pt-2.5 border-t border-[#F3F4F7] flex items-center justify-between">
<span class="flex items-center gap-1 text-[12px] text-[#8A93A5]">
<iconify-icon class="text-[14px] text-[#1FAF6B]" icon="mdi:check-circle-outline"></iconify-icon>
                    状态正常 · 保养计划已就绪
                  </span>
<iconify-icon class="text-[16px] text-[#C3C9D4]" icon="mdi:chevron-right"></iconify-icon>
</div>
</div>
</div>
</a>
<!-- 4. 已过保 -->
<a class="block rounded-xl bg-white border border-[#EEF0F4] p-3.5 shadow-[0_2px_10px_rgba(17,24,39,0.03)] opacity-60 active:scale-[0.99] transition" href="device_detail.html">
<div class="flex items-start gap-3">
<span class="w-11 h-11 rounded-full bg-[#F1F3F7] text-[#8A93A5] flex items-center justify-center shrink-0">
<iconify-icon class="text-[23px]" icon="mdi:water-boiler"></iconify-icon>
</span>
<div class="flex-1 min-w-0">
<div class="flex items-start justify-between gap-2">
<div class="min-w-0">
<p class="text-[14px] font-semibold text-[#4B5563] truncate">老式热水器</p>
<p class="mt-0.5 text-[12px] text-[#8A93A5] truncate">美的 F6032-JA7</p>
</div>
<span class="shrink-0 text-[10px] leading-4 px-2 py-1 rounded-full bg-[#F1F3F7] text-[#8A93A5] font-medium">已过保</span>
</div>
<div class="mt-2.5 pt-2.5 border-t border-[#F3F4F7] flex items-center justify-between">
<span class="flex items-center gap-1 text-[12px] text-[#8A93A5]">
<iconify-icon class="text-[14px]" icon="mdi:shield-off-outline"></iconify-icon>
                    保修已到期
                  </span>
<iconify-icon class="text-[16px] text-[#C3C9D4]" icon="mdi:chevron-right"></iconify-icon>
</div>
</div>
</div>
</a>
</div>
<p class="mt-4 mb-24 text-center text-[11px] text-[#A5ADBB]">共 4 台 · 3 台在保</p>
</section>
</main>
<!-- 悬浮添加按钮 -->
<a aria-label="添加家电" class="absolute right-4 bottom-[96px] z-20 h-11 pl-3.5 pr-4 rounded-full bg-[#3D6DF2] text-white flex items-center gap-1 shadow-[0_10px_24px_rgba(61,109,242,0.45)] active:scale-95 transition" href="add_appliance.html">
<iconify-icon class="text-[20px]" icon="mdi:plus"></iconify-icon>
<span class="text-[13px] font-semibold">添加家电</span>
</a>
<!-- 底部导航 -->
<nav class="shrink-0 bg-white border-t border-[#ECEEF3] px-2 pt-2 pb-5">
<div class="grid grid-cols-4">
<a class="flex flex-col items-center gap-1 py-1 text-[#3D6DF2]" href="home.html">
<iconify-icon class="text-[22px]" icon="mdi:home-variant"></iconify-icon>
<span class="text-[11px] font-semibold">首页</span>
</a>
<a class="flex flex-col items-center gap-1 py-1 text-[#9AA3B2]" href="appliances.html">
<iconify-icon class="text-[22px]" icon="mdi:fridge-outline"></iconify-icon>
<span class="text-[11px]">家电</span>
</a>
<a class="flex flex-col items-center gap-1 py-1 text-[#9AA3B2]" href="reminders.html">
<iconify-icon class="text-[22px]" icon="mdi:bell-outline"></iconify-icon>
<span class="text-[11px]">提醒</span>
</a>
<a class="flex flex-col items-center gap-1 py-1 text-[#9AA3B2]" href="profile.html">
<iconify-icon class="text-[22px]" icon="mdi:account-outline"></iconify-icon>
<span class="text-[11px]">我的</span>
</a>
</div>
</nav>
</div>
</body>
</html>
