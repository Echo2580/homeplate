<!DOCTYPE html>

<html class="w-full h-full overflow-hidden" lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>提醒设置 · homeplate</title>
<script src="https://modao.cc/agent-py/static/source/js/tailwindcss.js"></script>
<script src="https://modao.cc/agent-py/static/source/js/iconify-icon.min.js"></script>
<style>
    :root {
      --brand: #3D6DF2;
      --warn: #FF7A45;
      --success: #1FAF6B;
      --muted: #8A93A5;
      --surface: #F5F6F8;
    }
    html, body {
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      background: #E9EBF0;
    }
    .safe-bottom { padding-bottom: 20px; }
    .no-scrollbar { scrollbar-width: none; -ms-overflow-style: none; }
    .no-scrollbar::-webkit-scrollbar { display: none; }

    /* iOS 风格开关 */
    .ios-switch {
      position: relative;
      width: 46px;
      height: 28px;
      border-radius: 999px;
      background: #D7DBE2;
      flex: 0 0 auto;
      transition: background-color .22s ease;
      cursor: pointer;
      border: none;
      padding: 0;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }
    .ios-switch::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 24px;
      height: 24px;
      border-radius: 999px;
      background: #FFFFFF;
      box-shadow: 0 1px 3px rgba(20, 30, 50, .20), 0 1px 1px rgba(20, 30, 50, .06);
      transition: transform .22s cubic-bezier(.4, 0, .2, 1);
    }
    .ios-switch[aria-checked="true"] {
      background: var(--brand);
    }
    .ios-switch[aria-checked="true"]::after {
      transform: translateX(18px);
    }
    .ios-switch:focus-visible {
      box-shadow: 0 0 0 3px rgba(61, 109, 242, .25);
    }

    /* 时间滚轮选中条 */
    .time-band {
      position: absolute;
      left: 14px;
      right: 14px;
      height: 40px;
      border-radius: 10px;
      background: #F2F5FE;
      border-top: 1px solid #E2E9FC;
      border-bottom: 1px solid #E2E9FC;
      pointer-events: none;
      z-index: 0;
    }
    .snap-col {
      scroll-snap-type: y mandatory;
      overscroll-behavior: contain;
    }
    .snap-item {
      scroll-snap-align: center;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-variant-numeric: tabular-nums;
    }
    .backdrop-enter { animation: fadeIn .18s ease-out both; }
    .sheet-enter { animation: riseUp .26s cubic-bezier(.32, .72, 0, 1) both; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes riseUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  </style>
</head>
<body class="w-full h-full m-0 overflow-hidden flex items-center justify-center">
<div class="w-full h-full max-w-[393px] max-h-[852px] bg-[#F5F6F8] flex flex-col overflow-hidden relative" id="appFrame">
<!-- 顶部导航 -->
<header class="shrink-0 bg-[#F5F6F8]/95 backdrop-blur-sm z-20">
<div class="h-[52px] px-4 flex items-center justify-between relative">
<a aria-label="返回上一页" class="w-9 h-9 -ml-1 flex items-center justify-center rounded-full text-[#1D2433] active:bg-black/5" href="javascript:history.length &gt; 1 ? history.back() : void 0">
<iconify-icon icon="mdi:arrow-left" style="font-size:24px"></iconify-icon>
</a>
<h1 class="absolute left-1/2 -translate-x-1/2 text-[17px] font-semibold text-[#1D2433] tracking-wide">提醒设置</h1>
<button aria-label="更多操作" class="w-9 h-9 -mr-1 flex items-center justify-center rounded-full text-[#5A6376] active:bg-black/5" type="button">
<iconify-icon icon="mdi:dots-horizontal" style="font-size:22px"></iconify-icon>
</button>
</div>
</header>
<!-- 主滚动区 -->
<main class="flex-1 min-h-0 overflow-y-auto overflow-x-hidden no-scrollbar">
<div class="px-4 pb-2">
<!-- 概览条 -->
<section class="mt-3 rounded-xl bg-[#3D6DF2] px-4 py-3.5 flex items-center gap-3 shadow-[0_6px_16px_-8px_rgba(61,109,242,.7)]">
<div class="w-9 h-9 rounded-full bg-white/15 flex items-center justify-center shrink-0">
<iconify-icon class="text-white" icon="mdi:bell-ring-outline" style="font-size:20px"></iconify-icon>
</div>
<div class="min-w-0 flex-1">
<p class="text-white text-[14px] font-semibold leading-5" id="summaryTitle">已开启 3 项提醒</p>
<p class="text-white/70 text-[12px] leading-4 mt-0.5">最近一条：10 月 15 日 10:00 保修到期提醒</p>
</div>
<span class="shrink-0 text-[11px] text-white/90 bg-white/15 rounded-full px-2 py-[3px]">全部开启</span>
</section>
<!-- 分组 1：推送渠道 -->
<section class="mt-5">
<h2 class="px-1 mb-2 text-[15px] font-semibold text-[#1D2433]">推送渠道</h2>
<div class="bg-white rounded-xl shadow-[0_1px_2px_rgba(20,30,50,.04),0_8px_20px_-16px_rgba(20,30,50,.30)] overflow-hidden">
<div class="flex items-center gap-3 px-4 py-3.5">
<span class="w-9 h-9 rounded-[10px] bg-[#EDF2FE] flex items-center justify-center shrink-0">
<iconify-icon class="text-[#3D6DF2]" icon="mdi:bell-outline" style="font-size:20px"></iconify-icon>
</span>
<div class="flex-1 min-w-0">
<p class="text-[14px] font-medium text-[#1D2433] leading-5">微信推送</p>
<p class="text-[12px] text-[#8A93A5] leading-4 mt-0.5">推送到微信服务号</p>
</div>
<button aria-checked="true" aria-label="微信推送开关" class="ios-switch" data-channel="wechat" onclick="toggleSwitch(this)" role="switch" type="button"></button>
</div>
<div class="h-px bg-[#F0F2F5] ml-16"></div>
<div class="flex items-center gap-3 px-4 py-3.5">
<span class="w-9 h-9 rounded-[10px] bg-[#F2F4F7] flex items-center justify-center shrink-0">
<iconify-icon class="text-[#8A93A5]" icon="mdi:email-outline" style="font-size:20px"></iconify-icon>
</span>
<div class="flex-1 min-w-0">
<p class="text-[14px] font-medium text-[#1D2433] leading-5">邮件提醒</p>
<p class="text-[12px] text-[#8A93A5] leading-4 mt-0.5">备用渠道</p>
</div>
<button aria-checked="false" aria-label="邮件提醒开关" class="ios-switch" data-channel="email" onclick="toggleSwitch(this)" role="switch" type="button"></button>
</div>
</div>
<p class="px-1 mt-2 text-[12px] text-[#8A93A5] leading-4 flex items-center gap-1" id="channelHint">
<iconify-icon class="text-[#B0B7C3]" icon="mdi:information-outline" style="font-size:14px"></iconify-icon>
            主渠道关闭后，将自动启用邮件作为兜底通知
          </p>
</section>
<!-- 分组 2：提醒规则 -->
<section class="mt-5">
<h2 class="px-1 mb-2 text-[15px] font-semibold text-[#1D2433]">提醒规则</h2>
<div class="bg-white rounded-xl shadow-[0_1px_2px_rgba(20,30,50,.04),0_8px_20px_-16px_rgba(20,30,50,.30)] overflow-hidden">
<div class="flex items-center gap-3 px-4 py-3.5">
<span class="w-9 h-9 rounded-[10px] bg-[#FFF3EE] flex items-center justify-center shrink-0">
<iconify-icon class="text-[#FF7A45]" icon="mdi:shield-alert-outline" style="font-size:20px"></iconify-icon>
</span>
<div class="flex-1 min-w-0">
<p class="text-[14px] font-medium text-[#1D2433] leading-5">保修到期提醒</p>
<p class="text-[12px] text-[#8A93A5] leading-4 mt-0.5">提前 30 天 + 7 天两次</p>
</div>
<button aria-checked="true" aria-label="保修到期提醒开关" class="ios-switch" data-rule="warranty" onclick="toggleSwitch(this)" role="switch" type="button"></button>
</div>
<div class="h-px bg-[#F0F2F5] ml-16"></div>
<div class="flex items-center gap-3 px-4 py-3.5">
<span class="w-9 h-9 rounded-[10px] bg-[#EDF2FE] flex items-center justify-center shrink-0">
<iconify-icon class="text-[#3D6DF2]" icon="mdi:calendar-clock-outline" style="font-size:20px"></iconify-icon>
</span>
<div class="flex-1 min-w-0">
<p class="text-[14px] font-medium text-[#1D2433] leading-5">保养到期提醒</p>
<p class="text-[12px] text-[#8A93A5] leading-4 mt-0.5 pr-2">到期当天 + 逾期 7 天未处理再催一次</p>
</div>
<button aria-checked="true" aria-label="保养到期提醒开关" class="ios-switch" data-rule="maintenance" onclick="toggleSwitch(this)" role="switch" type="button"></button>
</div>
<div class="h-px bg-[#F0F2F5] ml-16"></div>
<div class="flex items-center gap-3 px-4 py-3.5">
<span class="w-9 h-9 rounded-[10px] bg-[#EAF8F1] flex items-center justify-center shrink-0">
<iconify-icon class="text-[#1FAF6B]" icon="mdi:message-text-outline" style="font-size:20px"></iconify-icon>
</span>
<div class="flex-1 min-w-0">
<p class="text-[14px] font-medium text-[#1D2433] leading-5">维修回访提醒</p>
<p class="text-[12px] text-[#8A93A5] leading-4 mt-0.5">维修后 30 天询问使用情况</p>
</div>
<button aria-checked="true" aria-label="维修回访提醒开关" class="ios-switch" data-rule="followup" onclick="toggleSwitch(this)" role="switch" type="button"></button>
</div>
</div>
</section>
<!-- 分组 3：勿扰时段 -->
<section class="mt-5">
<h2 class="px-1 mb-2 text-[15px] font-semibold text-[#1D2433]">勿扰时段</h2>
<div class="bg-white rounded-xl shadow-[0_1px_2px_rgba(20,30,50,.04),0_8px_20px_-16px_rgba(20,30,50,.30)] overflow-hidden">
<button aria-label="编辑勿扰时段" class="w-full flex items-center gap-3 px-4 py-3.5 text-left active:bg-[#FAFBFD]" onclick="openQuietSheet()" type="button">
<span class="w-9 h-9 rounded-[10px] bg-[#F1EFFE] flex items-center justify-center shrink-0">
<iconify-icon class="text-[#6C5CE7]" icon="mdi:moon-waning-crescent" style="font-size:20px"></iconify-icon>
</span>
<div class="flex-1 min-w-0">
<p class="text-[14px] font-medium text-[#1D2433] leading-5">
<span id="quietText">22:00 - 08:00 不推送</span>
</p>
<p class="text-[12px] text-[#8A93A5] leading-4 mt-0.5">此时段内提醒将顺延至次日 08:00 发送</p>
</div>
<span class="flex items-center gap-0.5 text-[13px] text-[#3D6DF2] font-medium shrink-0">
                编辑
                <iconify-icon icon="mdi:chevron-right" style="font-size:18px"></iconify-icon>
</span>
</button>
</div>
</section>
<!-- 底部提示 -->
<p class="safe-bottom mt-5 px-2 text-[12px] leading-[18px] text-[#8A93A5] text-center">
          提醒通过链接直达处理页面，处理后自动停止重复推送
        </p>
</div>
</main>
<!-- 保存反馈 -->
<div class="pointer-events-none absolute left-1/2 -translate-x-1/2 bottom-8 z-40 opacity-0 transition-opacity duration-200" id="toast">
<div class="bg-[#1D2433]/92 text-white text-[12px] px-4 py-2 rounded-full shadow-lg backdrop-blur-sm whitespace-nowrap" id="toastText">设置已保存</div>
</div>
<!-- 勿扰时段编辑面板 -->
<div class="hidden absolute inset-0 z-30 bg-black/35 backdrop-enter" id="quietBackdrop"></div>
<div class="hidden absolute inset-x-0 bottom-0 z-30 bg-white rounded-t-2xl sheet-enter" id="quietSheet">
<div class="pt-3 pb-1 flex justify-center">
<span class="w-9 h-1 rounded-full bg-[#E3E6EB]"></span>
</div>
<div class="px-5 pt-2 flex items-center justify-between">
<button class="text-[14px] text-[#8A93A5] py-1 pr-2" onclick="closeQuietSheet()" type="button">取消</button>
<p class="text-[15px] font-semibold text-[#1D2433]">勿扰时段</p>
<button class="text-[14px] font-medium text-[#3D6DF2] py-1 pl-2" onclick="saveQuiet()" type="button">保存</button>
</div>
<p class="px-5 mt-1 text-center text-[12px] text-[#8A93A5]">该时段内不发送任何推送</p>
<div class="px-5 mt-4">
<div class="relative rounded-xl bg-[#FAFBFD] border border-[#EFF1F5] px-3 py-3">
<div class="time-band top-[17px]"></div>
<div class="relative z-10 flex items-stretch">
<!-- 开始时间 -->
<div class="flex-1 flex flex-col items-center">
<span class="text-[11px] text-[#8A93A5] mb-1.5">开始</span>
<div class="flex items-center gap-1">
<div class="snap-col h-[120px] w-[42px] overflow-y-auto no-scrollbar" data-kind="start-h" id="colStartH"></div>
<span class="text-[18px] font-semibold text-[#1D2433] leading-[40px]">:</span>
<div class="snap-col h-[120px] w-[42px] overflow-y-auto no-scrollbar" data-kind="start-m" id="colStartM"></div>
</div>
</div>
<div class="w-7 flex items-center justify-center">
<iconify-icon class="text-[#C3C9D4]" icon="mdi:arrow-right" style="font-size:18px"></iconify-icon>
</div>
<!-- 结束时间 -->
<div class="flex-1 flex flex-col items-center">
<span class="text-[11px] text-[#8A93A5] mb-1.5">结束</span>
<div class="flex items-center gap-1">
<div class="snap-col h-[120px] w-[42px] overflow-y-auto no-scrollbar" data-kind="end-h" id="colEndH"></div>
<span class="text-[18px] font-semibold text-[#1D2433] leading-[40px]">:</span>
<div class="snap-col h-[120px] w-[42px] overflow-y-auto no-scrollbar" data-kind="end-m" id="colEndM"></div>
</div>
</div>
</div>
<div class="pointer-events-none absolute inset-x-0 top-[35px] h-[120px] bg-gradient-to-b from-[#FAFBFD] via-transparent to-[#FAFBFD]"></div>
</div>
</div>
<div class="px-5 mt-4">
<div class="flex gap-2">
<button class="px-3 py-1.5 rounded-full text-[12px] text-[#5A6376] bg-[#F3F5F8]" onclick="applyPreset(22, 8)" type="button">22:00 - 08:00</button>
<button class="px-3 py-1.5 rounded-full text-[12px] text-[#5A6376] bg-[#F3F5F8]" onclick="applyPreset(23, 7)" type="button">23:00 - 07:00</button>
<button class="px-3 py-1.5 rounded-full text-[12px] text-[#5A6376] bg-[#F3F5F8]" onclick="applyPreset(0, 7)" type="button">00:00 - 07:00</button>
</div>
</div>
<div class="h-5"></div>
<div class="safe-bottom"></div>
</div>
</div>
<script>
    var quietState = { startH: 22, startM: 0, endH: 8, endM: 0 };
    var toastTimer = null;

    function pad(n) {
      return n < 10 ? '0' + n : String(n);
    }

    function toggleSwitch(el) {
      var on = el.getAttribute('aria-checked') === 'true';
      el.setAttribute('aria-checked', on ? 'false' : 'true');
      var label = el.getAttribute('aria-label') || '提醒';
      showToast(label.replace('开关', '') + (on ? '已关闭' : '已开启'));
      refreshSummary();
    }

    function showToast(msg) {
      var toast = document.getElementById('toast');
      document.getElementById('toastText').textContent = msg || '设置已保存';
      toast.style.opacity = '1';
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () {
        toast.style.opacity = '0';
      }, 1800);
    }

    function refreshSummary() {
      var rules = document.querySelectorAll('.ios-switch[data-rule]');
      var count = 0;
      rules.forEach(function (r) {
        if (r.getAttribute('aria-checked') === 'true') count++;
      });
      var title = document.getElementById('summaryTitle');
      if (title) {
        title.textContent = count === 0 ? '提醒规则已全部暂停' : '已开启 ' + count + ' 项提醒';
      }
      var email = document.querySelector('.ios-switch[data-channel="email"]');
      var hint = document.getElementById('channelHint');
      if (email && hint) {
        var emailOn = email.getAttribute('aria-checked') === 'true';
        hint.innerHTML = emailOn
          ? '<iconify-icon icon="mdi:information-outline" style="font-size:14px" class="text-[#B0B7C3]"></iconify-icon>邮件提醒已开启，重要提醒将同步发送至绑定邮箱'
          : '<iconify-icon icon="mdi:information-outline" style="font-size:14px" class="text-[#B0B7C3]"></iconify-icon>主渠道关闭后，将自动启用邮件作为兜底通知';
      }
    }

    function buildColumn(el, max, value) {
      var html = '';
      for (var i = 0; i <= max; i++) {
        html += '<button type="button" class="snap-item w-full text-[17px] text-[#1D2433] font-medium" data-val="' + i + '">' + pad(i) + '</button>';
      }
      el.innerHTML = html;
      el.scrollTop = value * 40;
    }

    function renderColumns() {
      buildColumn(document.getElementById('colStartH'), 23, quietState.startH);
      buildColumn(document.getElementById('colStartM'), 59, quietState.startM);
      buildColumn(document.getElementById('colEndH'), 23, quietState.endH);
      buildColumn(document.getElementById('colEndM'), 59, quietState.endM);
    }

    function readColumn(el) {
      return Math.round(el.scrollTop / 40);
    }

    function openQuietSheet() {
      renderColumns();
      document.getElementById('quietBackdrop').classList.remove('hidden');
      document.getElementById('quietSheet').classList.remove('hidden');
    }

    function closeQuietSheet() {
      document.getElementById('quietBackdrop').classList.add('hidden');
      document.getElementById('quietSheet').classList.add('hidden');
    }

    function saveQuiet() {
      var sh = readColumn(document.getElementById('colStartH'));
      var sm = readColumn(document.getElementById('colStartM'));
      var eh = readColumn(document.getElementById('colEndH'));
      var em = readColumn(document.getElementById('colEndM'));
      quietState = { startH: sh, startM: sm, endH: eh, endM: em };
      document.getElementById('quietText').textContent = pad(sh) + ':' + pad(sm) + ' - ' + pad(eh) + ':' + pad(em) + ' 不推送';
      closeQuietSheet();
      showToast('勿扰时段已更新');
    }

    function applyPreset(sh, eh) {
      quietState = { startH: sh, startM: 0, endH: eh, endM: 0 };
      renderColumns();
    }

    (function init() {
      var backdrop = document.getElementById('quietBackdrop');
      backdrop.addEventListener('click', closeQuietSheet);
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') closeQuietSheet();
      });
      refreshSummary();
    })();
  </script>
</body>
</html>
