<style>
    :root {
      --brand: #3D6DF2;
      --warn: #FF7A45;
      --success: #1FAF6B;
      --muted: #8A93A5;
      --surface: #F5F6F8;
    }
    html, body {
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      background: #E9EBF0;
    }
    .safe-bottom { padding-bottom: 20px; }
    .no-scrollbar { scrollbar-width: none; -ms-overflow-style: none; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .card-shadow { box-shadow: 0 1px 2px rgba(20, 30, 50, .04), 0 6px 16px -10px rgba(20, 30, 50, .18); }

    /* iOS 风格开关 */
    .ios-switch {
      position: relative;
      width: 46px;
      height: 28px;
      border-radius: 999px;
      background: #D7DBE2;
      flex: 0 0 auto;
      transition: background-color .22s ease;
      cursor: pointer;
      border: none;
      padding: 0;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }
    .ios-switch::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 24px;
      height: 24px;
      border-radius: 999px;
      background: #FFFFFF;
      box-shadow: 0 1px 3px rgba(20, 30, 50, .20), 0 1px 1px rgba(20, 30, 50, .06);
      transition: transform .22s cubic-bezier(.4, 0, .2, 1);
    }
    .ios-switch[aria-checked="true"] {
      background: var(--brand);
    }
    .ios-switch[aria-checked="true"]::after {
      transform: translateX(18px);
    }
    .ios-switch:focus-visible {
      box-shadow: 0 0 0 3px rgba(61, 109, 242, .25);
    }
  </style>
</head>

<!-- 轻提示 -->
<div aria-live="polite" class="pointer-events-none absolute left-1/2 -translate-x-1/2 bottom-8 z-40 opacity-0 transition-opacity duration-200" id="toast" role="status">
<div class="bg-[#1D2433]/92 text-white text-[12px] px-4 py-2 rounded-full shadow-lg backdrop-blur-sm whitespace-nowrap" id="toastText">设置已保存</div>
</div>
</div>
<script>
    var toastTimer = null;

    function showToast(msg) {
      var toast = document.getElementById('toast');
      document.getElementById('toastText').textContent = msg || '设置已保存';
      toast.style.opacity = '1';
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () {
        toast.style.opacity = '0';
      }, 1800);
    }

    function toggleDark(el) {
      var on = el.getAttribute('aria-checked') === 'true';
      el.setAttribute('aria-checked', on ? 'false' : 'true');
      showToast(on ? '深色模式已关闭' : '深色模式已开启');
    }
  </script>
